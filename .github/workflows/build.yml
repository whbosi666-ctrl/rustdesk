name: Build & QR Code
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable' }
      - run: flutter pub get
      - run: flutter build apk --split-per-abi --target-platform android-arm64 --release
      - run: |
          APK=$(ls build/app/outputs/flutter-apk/*arm64-v8a-release.apk)
          URL=$(curl -s -T "$APK" https://bashupload.com | grep -o 'https://bashupload.com/[^"]*')
          echo "==================== DOWNLOAD URL ===================="
          echo "$URL"
          echo "======================================================"
          npx qrcode-terminal "$URL"
