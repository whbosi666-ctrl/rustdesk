name: Build Custom RustDesk APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install System Dependencies (LLVM/Clang/Protoc)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libclang-dev pkg-config cmake build-essential protoc

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Install Rust Tools
        run: |
          cargo install cargo-ndk || true
          cargo install flutter_rust_bridge_codegen || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-apk
          path: build/app/outputs/flutter-apk/*.apk