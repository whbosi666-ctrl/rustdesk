name: Build RustDesk Complete APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-dev libclang-dev clang cmake build-essential nasm yasm pkg-config libva-dev libvdpau-dev libX11-dev libxcb1-dev libXfixes-dev protoc

      - name: Install Codegen & Generate Bridge
        run: |
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          flutter pub get
          # 生成关键的 generated_bridge.dart
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ../src/flutter_ffi.rs --dart-output ./lib/generated_bridge.dart --c-output ./macos/Runner/bridge_generated.h

      - name: Build APK (Release)
        run: |
          # 禁用 tree-shake-icons 以防图标丢失
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-release-apk
          path: build/app/outputs/flutter-apk/*.apk